name: One-time public instructions closeout
on:
  push:
    branches: [integration/public-g219-closeout-20261104]
    paths: [.github/workflows/public-closeout-docs-once.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integration/public-g219-closeout-20261104
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct runnable instructions, not historical evidence
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('docs/FAMILY-ASSEMBLY.md');prefix,suffix=p.read_text().split('## Current G212 installation',1)
          for a,b in [
            ('G213','G219'),('G218','G220'),('2.8.213','2.8.219'),('2.8.218','2.8.220'),('g213','g219'),
            ('6ea3fa5222c56d8ee2451c7c2d51e7d1dc5894e3','bf97a9fd9d4a75a379363fa69811455303c36155'),
            ('9b7cd7c6e6be0a8a808fb73c27c67af9c3a1b224','3be58cd17109fc692ad0a91ec09f7a737164fe8d'),
            ('ba073d40ad2bbf3ef8f68ea1121c3f9d9d81dd10acdb4085eb2bf15b0c000643','72443b1f5e32ab36736c57a2635b5a7bf0a2d409ee221e5b2f5f2fedb74b0d36'),
            ('9dca47ba396ede83a6dfd8146cef58474aa77555de154a400fe28289496ee822','2d4b4d35607fb22f1c9c46b81ab2031196b56b0d7b54bc6cfe9268637dade678')]:prefix=prefix.replace(a,b)
          prefix=prefix.replace('previous G219 four-pack','previous G213 four-pack').replace('old G212/G219 output','old G212/G213 output')
          prefix=prefix.replace('[the fixed-input report](validation-public-player-20261103.json).','[the historical G213/G218 report](validation-public-player-20261103.json). The current integrated G219/G220 real-input reconstruction is recorded in [closeout run 41749132045](https://github.com/burnt-tea-dev/senluo-bedrock-core/actions/runs/41749132045); do not substitute historical evidence for current output.')
          p.write_text(prefix+'## Current G212 installation'+suffix)
          p=pathlib.Path('README.md');s=p.read_text();old='checked. [The report](docs/validation-public-player-20261103.json) retains the'
          new='checked. The current G219 source produces local G220; [its real-input closeout](https://github.com/burnt-tea-dev/senluo-bedrock-core/pull/46) records the exact candidate. [The historical G213/G218 report](docs/validation-public-player-20261103.json) retains the'
          assert old in s;p.write_text(s.replace(old,new))
          package=pathlib.Path('package.json');obj=json.loads(package.read_text());assert obj['version']=='0.32.0';obj['version']='0.32.1';package.write_text(json.dumps(obj,indent=2)+'\n')
          pathlib.Path('.github/workflows/public-closeout-docs-once.yml').unlink()
          pub=json.loads(pathlib.Path('PUBLICATION.json').read_text());p=pathlib.Path('release-history.json');hist=json.loads(p.read_text());assert '0.32.1' not in hist
          entry={k:v for k,v in hist['0.32.0'].items() if k!='payloads'};entry['toolkit_version']='0.32.1'
          entry['payloads']={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in pub['files'] if name!='release-history.json'}
          hist['0.32.1']=entry;p.write_text(json.dumps(hist,indent=2)+'\n')
          PY
          npm test > /tmp/core-node.log && tail -9 /tmp/core-node.log
          python -m unittest discover -s tests -p 'test_*.py' > /tmp/core-python.log 2>&1 || { tail -80 /tmp/core-python.log; exit 1; }
          tail -8 /tmp/core-python.log
          git add -A
          python tools/build_release.py --output /tmp/toolkit-docs-closeout
          git diff --cached --check
          git config user.name 'Senluo public integration'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'docs: align G219/G220 public commands in Toolkit0.32.1 without changing game output'
          git push origin HEAD:refs/heads/integration/public-g219-closeout-20261104
          git log -1 --format='%H %T %s'
