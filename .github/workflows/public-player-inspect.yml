name: Temporary public-only player inspection
on:
  push:
    branches: [fix/public-minimal-player-owner-20261103]
permissions:
  contents: write
jobs:
  inspect:
    if: github.repository == 'burnt-tea-dev/senluo-bedrock-core' && github.repository_id == '1439792715' && github.ref == 'refs/heads/fix/public-minimal-player-owner-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the exact locally tested source patch only on this isolated branch
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          text=pathlib.Path('.github/public-player-fix.patch.gz.b64').read_text().replace('I6ZZ6X','I6Z6X')
          patch=gzip.decompress(base64.b64decode(text))
          assert hashlib.sha256(patch).hexdigest()=='07c368eb2b4f0c32702587b192b816b807d906742718c8ad94a3282f4009225c'
          subprocess.run(['git','apply','--check','--index'],input=patch,check=True)
          subprocess.run(['git','apply','--index'],input=patch,check=True)
          expected={'tools/build_owned_family_recipe.py':'ee4b096f712be00a1a411f475667515a3a6c99ef','tools/assemble_family.py':'704e583c0a5ade352e19ac87f18afa882f4c389c','tests/test_public_minimal.py':'60054a29e506936bfbf4cfe4be6772ad10cec0e4','adapters/public-minimal-player.json':'f2e7f9197f1612dc03f91acf973af818dbf69c1b'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          assert changed==set(expected)
          for path,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path]).decode().strip()==sha,path
          PY
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.mjs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: burnt-tea-dev/kaleidoscope-grilling-unofficial
          ref: 6ea3fa5222c56d8ee2451c7c2d51e7d1dc5894e3
          path: .grilling-public
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Mojang/bedrock-samples
          ref: 15701fa9c13923f12662984c32c124327e40e3d3
          path: .vanilla-public
          persist-credentials: false
      - name: Reproduce the exact two-input baseline build
        run: |
          mkdir -p "$RUNNER_TEMP/public-inputs"
          curl --fail --location --retry 2 'https://edge.forgecdn.net/files/9317/31/Kaleidoscope%20Cookery%20v1.6.4.mcaddon' --output "$RUNNER_TEMP/cookery-original.mcaddon"
          echo "aa760058f43dce462778a3ac570ba5c1af629cb3b60fdc31bf457e589822eb83  $RUNNER_TEMP/cookery-original.mcaddon" | sha256sum -c -
          python tools/build_grilling_input.py --source .grilling-public --descriptor adapters/cookery-1.6.4-grilling-2.8.213-station-performance.json --output "$RUNNER_TEMP/public-inputs/grilling-2.8.213.mcaddon"
          python tools/install_cookery_from_descriptor.py --cookery "$RUNNER_TEMP/cookery-original.mcaddon" --grilling "$RUNNER_TEMP/public-inputs/grilling-2.8.213.mcaddon" --descriptor adapters/cookery-1.6.4-grilling-2.8.213-station-performance.json --output "$RUNNER_TEMP/public-inputs/cookery-g213.mcaddon"
          python tools/build_owned_family_recipe.py --descriptor adapters/public-minimal-grilling-g213-cookery20012.json --inputs "$RUNNER_TEMP/public-inputs" --output "$RUNNER_TEMP/public.recipe.json"
          python tools/assemble_family.py --recipe "$RUNNER_TEMP/public.recipe.json" --inputs "$RUNNER_TEMP/public-inputs" --output "$RUNNER_TEMP/public-output"
      - name: Build the repaired public player with the same two addon inputs
        run: |
          python tools/build_owned_family_recipe.py --profile public-minimal --grilling-source .grilling-public --vanilla-source .vanilla-public --inputs "$RUNNER_TEMP/public-inputs" --output "$RUNNER_TEMP/presented.recipe.json"
          python tools/assemble_family.py --recipe "$RUNNER_TEMP/presented.recipe.json" --inputs "$RUNNER_TEMP/public-inputs" --output "$RUNNER_TEMP/presented-output"
      - name: Execute both real public-output tests
        env:
          PUBLIC_MINIMAL_INPUTS: ${{ runner.temp }}/public-inputs
          PUBLIC_PLAYER_GRILLING_SOURCE: .grilling-public
          PUBLIC_PLAYER_VANILLA_SOURCE: .vanilla-public
        run: |
          mv "$RUNNER_TEMP/public-inputs/cookery-g213.mcaddon.receipt.json" "$RUNNER_TEMP/cookery-g213.receipt.json"
          python -m unittest discover -s tests -p test_public_minimal.py -v
      - name: Record baseline FAIL and repaired source PASS separately from client QA
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,sys,zipfile
          sys.path.insert(0,'tools')
          from assemble_family import read_definition
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          extension=json.loads(pathlib.Path('.grilling-public/projects/grilling/gameplay_core/behavior_pack/host-extensions/player-presentation.json').read_text())
          records=[]
          for output in ('public-output','presented-output'):
              players=[]
              for pack in ('grilling-rp','cookery-rp'):
                  with zipfile.ZipFile(root/output/(pack+'.mcpack')) as archive:
                      for name in archive.namelist():
                          if not name.startswith('entity/') or not name.endswith('.json'):
                              continue
                          raw=archive.read(name)
                          desc=read_definition(raw).get('minecraft:client_entity',{}).get('description',{})
                          if desc.get('identifier')!='minecraft:player':
                              continue
                          variables=desc.get('scripts',{}).get('variables',{})
                          animations=desc.get('animations',{})
                          players.append({'pack':pack,'path':name,'sha256':hashlib.sha256(raw).hexdigest(),'missing_public_variables':[key for key in extension['scripts']['variables'] if variables.get(key)!='public'],'missing_animations':[key for key,value in extension['animations'].items() if animations.get(key)!=value]})
              valid=len(players)==1 and players[0]['pack']=='grilling-rp' and not players[0]['missing_public_variables'] and not players[0]['missing_animations']
              records.append({'output':output,'resource_players':players,'resource_player_contract':'PASS' if valid else 'FAIL','aggregate_sha256':hashlib.sha256((root/output/'public-minimal.mcaddon').read_bytes()).hexdigest()})
          assert records[0]['resource_player_contract']=='FAIL'
          assert records[1]['resource_player_contract']=='PASS'
          assert hashlib.sha256((root/'cookery-original.mcaddon').read_bytes()).hexdigest()=='aa760058f43dce462778a3ac570ba5c1af629cb3b60fdc31bf457e589822eb83'
          report={'source':'Core #42 / G213 source with fresh G218 presentation + clean Cookery only','results':records,'original_cookery_unchanged':True,'client':'NOT-RUN','bds':'NOT-RUN'}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          (root/'public-player-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit only the tested source change and remove this temporary transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/public-player-inspect.yml .github/public-player-fix.patch.gz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(public-minimal): compose canonical resource player without optional addons'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/public-minimal-player-owner-20261103
          git archive --format=zip HEAD -o "$RUNNER_TEMP/core-source.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-player-inspection
          path: |
            ${{ runner.temp }}/core-source.zip
            ${{ runner.temp }}/public-player-report.json
          retention-days: 3
          if-no-files-found: warn
