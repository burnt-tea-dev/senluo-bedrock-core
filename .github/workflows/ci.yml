name: Core SDK and local adapter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'burnt-tea-dev/senluo-bedrock-core' && github.repository_id == '1439792715'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: burnt-tea-dev/kaleidoscope-grilling-unofficial
          ref: 61864d017a1e4e9847325cd7313098b4379dc2e9
          path: .grilling-input
          persist-credentials: false
      - name: Reproduce explicit historical G201 companion
        run: python tools/build_grilling_input.py --source .grilling-input --descriptor adapters/cookery-1.6.4.json --output "$RUNNER_TEMP/Grilling-2.8.201.mcaddon"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: burnt-tea-dev/kaleidoscope-grilling-unofficial
          ref: c879943b49c0947527a5fc8fc5341bc9827a708a
          path: .grilling-current
          persist-credentials: false
      - name: Reproduce explicit historical G203 companion
        run: python tools/build_grilling_input.py --source .grilling-current --descriptor adapters/cookery-1.6.4-grilling-2.8.203.json --output "$RUNNER_TEMP/Grilling-2.8.203.zip"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: burnt-tea-dev/kaleidoscope-grilling-unofficial
          ref: aa8a07ad223c993c05b0d356615d38e990148588
          path: .grilling-next
          persist-credentials: false
      - name: Reproduce default G212 and adapt exact clean author inputs locally
        run: |
          python tools/build_grilling_input.py --source .grilling-next --output "$RUNNER_TEMP/Grilling-2.8.212.mcaddon"
          curl --fail --location --retry 2 'https://edge.forgecdn.net/files/9104/552/Kaleidoscope%20Immersive%20Eating%20v1.1.0.mcaddon' --output "$RUNNER_TEMP/ie.mcaddon"
          curl --fail --location --retry 2 'https://edge.forgecdn.net/files/9317/31/Kaleidoscope%20Cookery%20v1.6.4.mcaddon' --output "$RUNNER_TEMP/cookery.mcaddon"
          python tools/install_player_presentation.py --ie "$RUNNER_TEMP/ie.mcaddon" --grilling "$RUNNER_TEMP/Grilling-2.8.212.mcaddon" --grilling-source .grilling-next --output "$RUNNER_TEMP/ie-g212.mcaddon"
          python tools/install_cookery_from_descriptor.py --cookery "$RUNNER_TEMP/cookery.mcaddon" --grilling "$RUNNER_TEMP/Grilling-2.8.212.mcaddon" --output "$RUNNER_TEMP/cookery-g212.mcaddon"
      - name: Verify the real Cookery station adapter
        # The ordinary test run above has no author inputs; this stage runs
        # the integration tests against the archives that were just verified.
        env:
          COOKERY_ORIGINAL_ARCHIVE: ${{ runner.temp }}/cookery.mcaddon
          GRILLING_ADAPTED_ARCHIVE: ${{ runner.temp }}/Grilling-2.8.212.mcaddon
        run: python -m unittest discover -s tests -p test_cookery_station_adapter.py -v
      - name: Obtain the exact local optional TACZ input
        run: |
          curl --fail --location --retry 2 'https://edge.forgecdn.net/files/7854/487/TACZ%20SkinPack%20by%20Kopystka%20Localization%20Studio.mcaddon' --output "$RUNNER_TEMP/tacz.mcaddon"
      - name: Obtain the exact original sound and unskinned texture assets
        run: |
          python - <<'PY_SOUND_INPUTS'
          import hashlib, io, json, os, pathlib, subprocess, urllib.request, zipfile
          descriptor=json.loads(pathlib.Path('adapters/tacz-1.0.3-grilling-2.8.212.json').read_bytes())
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'source-sounds'
          origin=descriptor['restored_sound_source']
          for name,pin in descriptor['restored_sound_files'].items():
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              url='https://raw.githubusercontent.com/'+origin['repository']+'/'+origin['commit']+'/'+pin['source']
              with urllib.request.urlopen(url,timeout=60) as response:
                  target.write_bytes(response.read())
          mirror=descriptor['unskinned_bedrock_source']
          raw=subprocess.check_output(['curl','--fail','--location','--max-time','60',
              '--max-filesize',str(mirror['archive_bytes']),mirror['source_url']])
          assert len(raw)==mirror['archive_bytes'] and hashlib.sha256(raw).hexdigest()==mirror['archive_sha256']
          # Only these selected original cosmetic bytes enter the local pair.
          # No script or manifest from the mirror is executed or installed.
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for name,pin in {**descriptor['restored_texture_files'], **descriptor['restored_model_files']}.items():
                  target=root/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.read(pin['source']))
          PY_SOUND_INPUTS
      - name: Reproduce TACZ with the corrected canonical animation composer
        run: python tools/install_tacz.py --tacz "$RUNNER_TEMP/tacz.mcaddon" --ie "$RUNNER_TEMP/ie.mcaddon" --grilling "$RUNNER_TEMP/Grilling-2.8.212.mcaddon" --grilling-source .grilling-next --source-sounds "$RUNNER_TEMP/source-sounds" --output "$RUNNER_TEMP/tacz-g212.mcaddon"
      - name: Real author projectile callback and attachable texture regression
        env:
          TACZ_ORIGINAL_ARCHIVE: ${{ runner.temp }}/tacz.mcaddon
          TACZ_ADAPTED_ARCHIVE: ${{ runner.temp }}/tacz-g212.mcaddon
        run: python -m unittest discover -s tests -p test_tacz_adapter.py -k real_ -v
      - name: Verify real archives under Linux and Windows ZIP defaults
        run: python tools/verify_archive_portability.py --grilling-source .grilling-next --composer-source .grilling-next --source-sounds "$RUNNER_TEMP/source-sounds" --cookery "$RUNNER_TEMP/cookery.mcaddon" --ie "$RUNNER_TEMP/ie.mcaddon" --tacz "$RUNNER_TEMP/tacz.mcaddon"
      - run: python tools/build_release.py --output dist
