name: Core SDK and local adapter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'burnt-tea-dev/senluo-bedrock-core' && github.repository_id == '1439792715'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test shared SDK and local adapter behavior
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py' -v
      # Releasing immutable source archives is a separate publication action.
      # Code and test edits do not need a new toolkit release identity.

  real-public-minimal:
    # Run explicitly when accepting an installer change; ordinary source CI
    # stays independent of author CDN availability and private family inputs.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'burnt-tea-dev/senluo-bedrock-core' && github.repository_id == '1439792715'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: burnt-tea-dev/kaleidoscope-grilling-unofficial
          ref: 6ea3fa5222c56d8ee2451c7c2d51e7d1dc5894e3
          path: .grilling-public
          persist-credentials: false
      - name: Reproduce only the pinned public Grilling and clean Cookery pair
        run: |
          mkdir -p "$RUNNER_TEMP/public-minimal-inputs"
          curl --fail --location --retry 2 'https://edge.forgecdn.net/files/9317/31/Kaleidoscope%20Cookery%20v1.6.4.mcaddon' --output "$RUNNER_TEMP/cookery-original.mcaddon"
          echo "aa760058f43dce462778a3ac570ba5c1af629cb3b60fdc31bf457e589822eb83  $RUNNER_TEMP/cookery-original.mcaddon" | sha256sum -c -
          python tools/build_grilling_input.py --source .grilling-public --descriptor adapters/cookery-1.6.4-grilling-2.8.213-station-performance.json --output "$RUNNER_TEMP/public-minimal-inputs/grilling-2.8.213.mcaddon"
          python tools/install_cookery_from_descriptor.py --cookery "$RUNNER_TEMP/cookery-original.mcaddon" --grilling "$RUNNER_TEMP/public-minimal-inputs/grilling-2.8.213.mcaddon" --descriptor adapters/cookery-1.6.4-grilling-2.8.213-station-performance.json --output "$RUNNER_TEMP/public-minimal-inputs/cookery-g213.mcaddon"
          mv "$RUNNER_TEMP/public-minimal-inputs/cookery-g213.mcaddon.receipt.json" "$RUNNER_TEMP/cookery-g213.receipt.json"
      - name: Verify real station adapter and repeatable four-pack public output
        env:
          PUBLIC_MINIMAL_INPUTS: ${{ runner.temp }}/public-minimal-inputs
          COOKERY_ORIGINAL_ARCHIVE: ${{ runner.temp }}/cookery-original.mcaddon
          GRILLING_ADAPTED_ARCHIVE: ${{ runner.temp }}/public-minimal-inputs/grilling-2.8.213.mcaddon
          COOKERY_TEST_DESCRIPTOR: adapters/cookery-1.6.4-grilling-2.8.213-station-performance.json
        run: |
          python -m unittest discover -s tests -p test_public_minimal.py -v
          python -m unittest discover -s tests -p test_cookery_station_adapter.py -v
