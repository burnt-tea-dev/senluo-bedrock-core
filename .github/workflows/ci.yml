name: Core SDK and local adapter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'burnt-tea-dev/senluo-bedrock-core' && github.repository_id == '1439792715'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test shared SDK and local adapter behavior
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py' -v
      # Releasing immutable source archives is a separate publication action.
      # Code and test edits do not need a new toolkit release identity.
