name: One-time public pair closeout
on:
  push:
    branches: [integration/public-g219-closeout-20261104]
    paths: [.github/workflows/public-closeout-once.yml]
permissions:
  contents: write
jobs:
  pair:
    if: github.repository_id == '1439792715'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integration/public-g219-closeout-20261104
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repeat exact real-input closeout with capability-based pair regression
        run: |
          python -u - <<'PY'
          import pathlib,subprocess,re,textwrap
          raw=subprocess.check_output(['git','show','2dce060b26c40c23f578fc0b7fe5884fc058a680:.github/workflows/public-closeout-once.yml']).decode()
          steps=re.findall(r'^      - name: ([^\n]+)\n        run: \|\n(.*?)(?=^      - (?:name:|uses:)|\Z)',raw,re.M|re.S)
          assert len(steps)==5, [x[0] for x in steps]
          for name,body in steps:
              print('CLOSEOUT STEP:',name,flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',textwrap.dedent(body)],check=True)
              if name=='Add exact new pairing and absorb scoped optional TACZ audit':
                  path=pathlib.Path('tests/test_public_minimal.py');text=path.read_text()
                  old="source = json.loads((ROOT / 'adapters/public-minimal-grilling-g213-cookery20012.json').read_text())"
                  assert text.count(old)==1
                  text=text.replace(old,"source = json.loads(builder.PUBLIC_COOKERY_DESCRIPTOR.read_text())")
                  old="self.assertEqual(public['inputs']['cookery'], source['inputs']['cookery'])\n        self.assertEqual(public['inputs']['grilling'], source['inputs']['grilling'])"
                  new="""self.assertEqual(public['inputs']['grilling']['sha256'], source['companion']['archive_sha256'])
                  self.assertEqual(public['player_presentation']['source']['commit'], source['companion']['source']['commit'])
                  self.assertEqual(public['player_presentation']['source']['git_tree'], source['companion']['source']['git_tree'])
                  for pack in public['packs']:
                      expected = source['companion']['version'] if pack['input'] == 'grilling' else source['output_version']
                      self.assertEqual(pack['version'], expected)
                  for rule in public['dependency_rewrites'].values():
                      self.assertEqual(rule['before'], source['author_version'])
                      self.assertEqual(rule['after'], source['output_version'])"""
                  new=textwrap.dedent(new)
                  # First line is already indented by its original location.
                  lines=new.splitlines();new=lines[0]+'\n'+'\n'.join('        '+row for row in lines[1:])
                  assert text.count(old)==1
                  path.write_text(text.replace(old,new))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-closeout-sanitized-summary
          path: /tmp/public-closeout-summary.json
          if-no-files-found: ignore
          retention-days: 7
